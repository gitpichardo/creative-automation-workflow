# Render Blueprint for imagekit-render-creative-automation.
#
# Deploy order (see README, "Next steps"):
#   1. Create the `creative-automation-shared` env group in the Dashboard
#   2. Create the Key Value instance; put its internal URL in the group as REDIS_URL
#   3. Create the Workflow service (Dashboard) and link the group; note its slug
#   4. Deploy this Blueprint: it creates the `api` web service only, and asks
#      for WORKFLOW_SLUG and RENDER_API_KEY at deploy time
#
# Workflow services (and the Key Value instance the workflow needs first) are
# not created here: Render Blueprints do not yet manage Workflows
# (https://render.com/docs/workflows).

# Only the api needs the Render API key (to start workflow runs), so it lives
# in its own group, separate from the config shared with the workflow.
envVarGroups:
  - name: creative-automation-trigger
    envVars:
      - key: RENDER_API_KEY
        sync: false

projects:
  - name: creative-automation
    environments:
      - name: production
        services:
          - type: web
            name: creative-automation-api
            runtime: node
            plan: starter
            region: oregon
            # Off so Deploy-to-Render forks don't redeploy every time this template
            # repo gets a push (https://render.com/docs/deploy-to-render).
            autoDeployTrigger: off
            buildCommand: npm ci && npm run build
            startCommand: npm run start:api
            envVars:
              # Created by you before deploying: IMAGEKIT_PRIVATE_KEY,
              # IMAGEKIT_PUBLIC_KEY, IMAGEKIT_URL_ENDPOINT, REDIS_URL,
              # MAX_ASSETS_PER_CAMPAIGN, AWAIT_TRANSFORMATION_TIMEOUT_MS.
              - fromGroup: creative-automation-shared
              - fromGroup: creative-automation-trigger
              # Slug of the Workflow service you created in step 3.
              - key: WORKFLOW_SLUG
                sync: false
              # Optional: signing secret from the ImageKit webhook dashboard.
              - key: IMAGEKIT_WEBHOOK_SECRET
                sync: false
              # Render sets RENDER_EXTERNAL_URL automatically; this duplicates it
              # under the name src/api/env.ts reads.
              - key: PUBLIC_BASE_URL
                fromService:
                  type: web
                  name: creative-automation-api
                  envVarKey: RENDER_EXTERNAL_URL
